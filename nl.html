<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Groeicurve NL</title>
<style>
  body { margin: 0; padding: 16px; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #fcfcfb; }
  #legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; font-size: 12px; color: #52514e; }
  #legend span { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  #legend .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  h2 { font-size: 15px; font-weight: 500; color: #0b0b0b; margin: 0 0 12px; }
</style>
</head>
<body>
<h2>Groeicurve per webinar — NL</h2>
<div style="position: relative; width: 100%; height: 420px;">
  <canvas id="chart" role="img" aria-label="Lijngrafiek groeicurve inschrijvingen per webinar, NL"></canvas>
</div>
<div id="legend"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const labels = ["25 aug", "26 aug", "28 aug", "29 aug", "30 aug", "31 aug", "1 sep", "2 sep", "3 sep", "4 sep", "5 sep", "6 sep", "7 sep", "8 sep", "9 sep"];
const seriesData = {"AI in de praktijk: slimmer werken met boekhouding, communicatie en kennis": [12, 12, 12, 12, 12, 13, 13, 15, 15, 15, 15, 15, 15, 16, 19], "De toekomst van het kantoor: hoe uitbesteding en AI ruimte maken voor klantgericht advies": [11, 11, 11, 11, 11, 12, 12, 14, 14, 14, 14, 14, 14, 15, 18], "Interne effici\u00ebntie door automatisering: zo win je tijd, houd je grip en krijg je sneller betaald": [15, 15, 16, 16, 16, 17, 17, 19, 19, 20, 20, 21, 21, 22, 25], "Prijsmodel onder druk? Hoe stuur je op rendabiliteit \u00e9n bouw je extra diensten uit?": [9, 9, 9, 9, 9, 10, 10, 12, 12, 12, 12, 12, 12, 12, 14], "Van bon en factuur tot automatische boeking: zo bouw je een effici\u00ebnte pre-accounting flow": [9, 9, 9, 9, 9, 10, 10, 12, 12, 12, 12, 12, 12, 13, 15], "Van cijfers naar gesprekken: hoe je rapportering, workflows en advies beter laat samenkomen": [13, 13, 13, 13, 13, 14, 14, 16, 16, 16, 16, 16, 16, 17, 19], "Van e-facturatie naar echte tijdswinst: zo bouw je aan een slimmer samenwerkende keten": [11, 11, 11, 11, 11, 12, 12, 14, 14, 14, 14, 14, 14, 15, 17], "Van losse klantinformatie naar \u00e9\u00e9n duidelijke flow: zo werk je slimmer samen met ondernemers": [9, 9, 9, 9, 9, 10, 10, 12, 12, 12, 12, 12, 12, 13, 15]};
const palette = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"];

const datasets = Object.keys(seriesData).map((title, i) => ({
  label: title,
  data: seriesData[title],
  borderColor: palette[i % palette.length],
  backgroundColor: "transparent",
  borderWidth: 2,
  pointRadius: 2,
  pointHoverRadius: 5,
  spanGaps: false,
  tension: 0.15,
}));

const chart = new Chart(document.getElementById('chart'), {
  type: 'line',
  data: { labels, datasets },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'nearest', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (item) => item.dataset.label + ': ' + (item.parsed.y ?? '—')
        }
      }
    },
    scales: {
      x: { grid: { display: false }, ticks: { color: '#898781', font: { size: 11 } } },
      y: { grid: { color: '#e1e0d9' }, ticks: { color: '#898781', font: { size: 11 } } }
    }
  }
});

const legendEl = document.getElementById('legend');
datasets.forEach((ds, i) => {
  const item = document.createElement('span');
  item.innerHTML = `<span class="sw" style="background:${ds.borderColor}"></span>${ds.label}`;
  item.onclick = () => {
    const meta = chart.getDatasetMeta(i);
    meta.hidden = !meta.hidden;
    item.style.opacity = meta.hidden ? '0.35' : '1';
    chart.update();
  };
  legendEl.appendChild(item);
});
</script>
</body>
</html>
